name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production
    steps:
      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script_stop: true
          script: |
            cd /opt/lenquant
            echo "Fetching latest from GitHub..."
            git fetch origin main
            echo "Hard resetting to origin/main (discarding local changes)..."
            git reset --hard origin/main
            git clean -fd -e .env.production
            export BUILD_VERSION=$(git rev-parse HEAD)
            echo "Building Docker images..."
            docker compose build
            echo "Recreating containers..."
            docker compose up -d --force-recreate --remove-orphans
            echo "Waiting for services to start..."
            sleep 15
            docker compose ps
            docker compose logs --no-color --tail=20 celery-worker celery-beat || true
            curl -sf http://localhost:8000/api/v1/health || (echo "Backend health check failed" && docker compose logs --tail=30 backend && exit 1)
            echo "Deploy successful at $(date)"
