name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.11]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ./apps/backend
          pip install pytest pytest-asyncio
      - name: Lint
        run: |
          pip install ruff
          ruff check .
      - name: Run unit tests
        working-directory: ./apps/backend
        run: |
          pytest -q

  lint-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        working-directory: ./apps/web
        run: npm install
      - name: Lint
        working-directory: ./apps/web
        run: npm run lint
      - name: Type check
        working-directory: ./apps/web
        run: npx tsc --noEmit

  docker-build:
    needs: [test, lint-web]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v5
        with:
          context: ./apps/backend
          file: ./apps/backend/Dockerfile
          push: false
          tags: lenquant-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build web image
        uses: docker/build-push-action@v5
        with:
          context: ./apps/web
          file: ./apps/web/Dockerfile
          push: false
          tags: lenquant-web:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=https://sites-api.lenquant.com
            NEXT_PUBLIC_APP_URL=https://sites.lenquant.com
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: docker-build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production
    steps:
      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script_stop: true
          script: |
            cd /opt/lenquant
            echo "Fetching latest from GitHub..."
            git fetch origin main
            echo "Hard resetting to origin/main (discarding local changes)..."
            git reset --hard origin/main
            git clean -fd -e .env.production
            echo "Building Docker images..."
            docker compose build
            echo "Recreating containers..."
            docker compose up -d --force-recreate
            echo "Waiting for services to start..."
            sleep 15
            docker compose ps
            curl -sf http://localhost:8000/api/v1/health || (echo "Backend health check failed" && docker compose logs --tail=30 backend && exit 1)
            echo "Deploy successful at $(date)"
