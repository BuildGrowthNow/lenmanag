name: Deploy

on:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install Node dependencies
        run: npm ci
      - name: Verify compiler contract
        run: npm --workspace apps/compiler run test:contract
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install backend dependencies
        run: |
          python -m pip install -e apps/backend
          python -m pip install ruff pytest
      - name: Run backend static checks
        working-directory: apps/backend
        run: |
          python -m ruff check app tests
          python -m compileall -q app
          python -m pytest tests/test_site_generation_remediation.py tests/test_static_runtime_guards.py tests/test_quality_gates.py tests/test_rollout.py -q

  deploy:
    runs-on: ubuntu-latest
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production
    steps:
      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script_stop: true
          script: |
            cd /opt/lenquant
            echo "Fetching latest from GitHub..."
            git fetch origin main
            echo "Hard resetting to origin/main (discarding local changes)..."
            git reset --hard origin/main
            git clean -fd -e .env.production
            export BUILD_VERSION=$(git rev-parse HEAD)
            echo "Building Docker images..."
            docker compose build
            echo "Recreating containers..."
            docker compose up -d --force-recreate --remove-orphans
            echo "Waiting for services to start..."
            sleep 15
            docker compose ps
            docker compose logs --no-color --tail=20 celery-worker celery-beat || true
            curl -sf http://localhost:8000/api/v1/health || (echo "Backend health check failed" && docker compose logs --tail=30 backend && exit 1)
            echo "Deploy successful at $(date)"
