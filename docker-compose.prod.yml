version: '3.8'

services:
  # Frontend - Next.js Application
  frontend:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-https://sites-api.lenquant.com}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-https://sites.lenquant.com}
    container_name: lenquant-frontend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - MONGODB_URI=${MONGODB_URI}
      - MONGODB_DB_NAME=${MONGODB_DB_NAME:-lenmanag}
      - SESSION_SECRET=${SESSION_SECRET}
      - AUTH_ALLOWLIST_EMAILS=${AUTH_ALLOWLIST_EMAILS}
      - AUTH_ALLOWLIST_DOMAINS=${AUTH_ALLOWLIST_DOMAINS}
      - SESSION_COOKIE_SECURE=true
      - SESSION_COOKIE_SAMESITE=strict
      - SESSION_COOKIE_DOMAIN=.lenquant.com
      - SESSION_COOKIE_MAX_AGE_SECONDS=28800
      - RESEND_API_KEY=${RESEND_API_KEY}
      - RESEND_FROM_EMAIL=${RESEND_FROM_EMAIL:-orders@lenquant.com}
      - RESEND_ADMIN_EMAIL=${RESEND_ADMIN_EMAIL}
      - NEXT_PUBLIC_STRIPE_PAYMENT_LINK=${NEXT_PUBLIC_STRIPE_PAYMENT_LINK}
    restart: always
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - lenquant-network
    depends_on:
      - backend
    labels:
      - "app=lenquant-frontend"
      - "version=1.0.0"
      - "environment=production"

  # Backend - FastAPI Application
  backend:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    container_name: lenquant-backend
    ports:
      - "8000:8000"
    environment:
      - APP_NAME=${APP_NAME:-Lenquant}
      - DATABASE_URL=${DATABASE_URL}
      - MONGODB_URI=${MONGODB_URI}
      - CORS_ORIGINS=https://sites.lenquant.com
      - LLM_PROVIDER=${LLM_PROVIDER:-cloudflare}
      - CLOUDFLARE_ACCOUNT_ID=${CLOUDFLARE_ACCOUNT_ID}
      - CLOUDFLARE_API_TOKEN=${CLOUDFLARE_API_TOKEN}
      - CLOUDFLARE_MODEL=${CLOUDFLARE_MODEL:-@cf/deepseek-ai/deepseek-v4-pro-0813}
      - CLOUDFLARE_FALLBACK_MODELS=${CLOUDFLARE_FALLBACK_MODELS:-@cf/zai-org/glm-5.3,@cf/qwen/qwen3.8-27b,@cf/deepseek-ai/deepseek-v4-flash-0731,@cf/zai-org/glm-5.3-flash}
      - CLOUDFLARE_VISION_MODEL=${CLOUDFLARE_VISION_MODEL:-@cf/zai-org/glm-5.3-flash}
      - BEDROCK_MODEL_ID=${BEDROCK_MODEL_ID:-us.anthropic.claude-sonnet-4-6-v1}
      - BEDROCK_REGION=${BEDROCK_REGION:-us-east-1}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - ASSET_STORAGE_BACKEND=${ASSET_STORAGE_BACKEND:-s3}
      - COMPILER_SERVICE_URL=http://compiler:3001
      - LOG_LEVEL=warning
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - lenquant-network
    depends_on:
      - redis
      - mongodb
      - compiler
    labels:
      - "app=lenquant-backend"
      - "version=1.0.0"
      - "environment=production"

  # Compiler - TSX Compilation Service
  compiler:
    build:
      context: ./apps/compiler
      dockerfile: Dockerfile
    container_name: lenquant-compiler
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - HOST=0.0.0.0
      - LOG_LEVEL=info
    restart: always
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - lenquant-network
    labels:
      - "app=lenquant-compiler"
      - "version=1.0.0"
      - "environment=production"

  # Redis - Cache & Job Queue
  redis:
    image: redis:7-alpine
    container_name: lenquant-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    volumes:
      - redis_data:/data
    networks:
      - lenquant-network
    labels:
      - "app=lenquant-redis"
      - "environment=production"

  # MongoDB - Database
  mongodb:
    image: mongo:7
    container_name: lenquant-mongodb
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_INITDB_ROOT_USERNAME}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_INITDB_ROOT_PASSWORD}
      - MONGO_INITDB_DATABASE=${MONGODB_DB_NAME:-lenmanag}
    restart: always
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
    networks:
      - lenquant-network
    labels:
      - "app=lenquant-mongodb"
      - "environment=production"

networks:
  lenquant-network:
    driver: bridge

volumes:
  redis_data:
    driver: local
  mongodb_data:
    driver: local
  mongodb_config:
    driver: local
