<body>

    // Simulated async data fetching (like a real SPA would do)
    function fetchData() {
        return new Promise((resolve) => {
            setTimeout(() => resolve(AppData), 800);
        });
    }

    // Component rendering functions (simulating React components)
    function renderHeader(data) {
        return '<header><nav><div class="logo">' + data.company.name + '</div><ul class="nav-links"><li><a href="#services">Services</a></li><li><a href="#process">Process</a></li><li><a href="#testimonials">Testimonials</a></li><li><a href="#team">Team</a></li><li><a href="#faq">FAQ</a></li><li><a href="#contact" class="cta-button" style="padding: 0.5rem 1.5rem; font-size: 0.9rem;">Get Started</a></li></ul></nav></header>';
    }

    function renderHero(data) {
        return '<section class="hero"><div class="animate-in"><h1>' + data.company.tagline + '</h1><p>' + data.company.description + '</p><a href="#contact" class="cta-button">Start Your Project</a><span style="display: inline-block; margin-left: 1rem; color: rgba(255,255,255,0.7);">or <a href="#services" style="color: #48c6ef;">explore our services</a></span></div></section>';
    }

    function renderServices(data) {
        var cards = data.services.map(function(s, i) {
            return '<article class="service-card animate-in delay-' + ((i % 4) + 1) + '"><div class="service-icon">' + s.icon + '</div><h3>' + s.title + '</h3><p>' + s.description + '</p></article>';
        }).join('');
        return '<section class="section" id="services"><h2 class="section-title">Our Services</h2><p class="section-subtitle">Comprehensive digital solutions tailored to your business needs</p><div class="services-grid">' + cards + '</div></section>';
    }

    function renderProcess(data) {
        var steps = data.process.map(function(p) {
            return '<div class="process-step animate-in delay-' + p.step + '"><div class="step-number">' + p.step + '</div><h3>' + p.title + '</h3><p>' + p.description + '</p></div>';
        }).join('');
        return '<section class="process-section" id="process"><h2 class="section-title">Our Process</h2><p class="section-subtitle">A proven methodology that delivers results</p><div class="process-steps">' + steps + '</div></section>';
    }

    function renderTestimonials(data) {
        var cards = data.testimonials.map(function(t) {
            return '<article class="testimonial-card"><p class="testimonial-text">' + t.text + '</p><div class="testimonial-author"><div class="author-avatar">' + t.initials + '</div><div class="author-info"><h4>' + t.author + '</h4><p>' + t.role + '</p></div></div></article>';
        }).join('');
        return '<section class="section testimonials" id="testimonials"><h2 class="section-title">What Our Clients Say</h2><p class="section-subtitle">Do not just take our word for it - hear from the teams we have worked with</p><div class="testimonial-grid">' + cards + '</div></section>';
    }

    function renderTeam(data) {
        var cards = data.team.map(function(t) {
            return '<article class="team-card animate-in"><div class="team-avatar">' + t.initials + '</div><h3>' + t.name + '</h3><p class="role">' + t.role + '</p><p>' + t.bio + '</p></article>';
        }).join('');
        return '<section class="team-section" id="team"><h2 class="section-title">Meet Our Team</h2><p class="section-subtitle">Talented professionals passionate about technology and innovation</p><div class="team-grid">' + cards + '</div></section>';
    }

    function renderTabs(data) {
        var techItems = data.tabs.technologies.items.map(function(i) { return '<li>' + i + '</li>'; }).join('');
        var indItems = data.tabs.industries.items.map(function(i) { return '<li>' + i + '</li>'; }).join('');

    function renderFAQ(data) {

    // Initialize interactive elements after render
    function initInteractivity() {
        // Tabs
        document.querySelectorAll('.tab-btn').forEach(function(btn) {
            btn.addEventListener('click', function() {
                document.querySelectorAll('.tab-btn').forEach(function(b) { b.classList.remove('active'); });
                document.querySelectorAll('.tab-content').forEach(function(c) { c.classList.remove('active'); });
                btn.classList.add('active');
                document.getElementById('tab-' + btn.dataset.tab).classList.add('active');
            });
        });

        // Accordion
        document.querySelectorAll('.accordion-header').forEach(function(header) {
            header.addEventListener('click', function() {
                var item = header.parentElement;
                var wasOpen = item.classList.contains('open');
                document.querySelectorAll('.accordion-item').forEach(function(i) { i.classList.remove('open'); });
                if (!wasOpen) item.classList.add('open');
            });
        });

        // Intersection Observer for animations
        var observer = new IntersectionObserver(function(entries) {
            entries.forEach(function(entry) {
                if (entry.isIntersecting) {
                    entry.target.style.animationPlayState = 'running';
                }
            });
        }, { threshold: 0.1 });

        document.querySelectorAll('.animate-in').forEach(function(el) {
            el.style.animationPlayState = 'paused';
            observer.observe(el);
        });
    }

    // Main app initialization - simulates SPA boot
    async function initApp() {
        var data = await fetchData();

        var appHTML = renderHeader(data) + renderHero(data) + renderServices(data) + renderStats(data) + renderProcess(data) + renderTabs(data) + renderTestimonials(data) + renderTeam(data) + renderFAQ(data) + renderCTA(data) + renderFooter(data);

        document.getElementById('app').innerHTML = appHTML;
        document.getElementById('loadingScreen').classList.add('hidden');

        // Initialize interactive components
        initInteractivity();

        // Simulate lazy-loaded content (additional data that loads after initial render)
        setTimeout(function() {
            var lazySection = document.createElement('section');
            lazySection.className = 'section';
            lazySection.id = 'lazy-loaded';
            lazySection.innerHTML = '<div style="background: #f0f2f5; border-radius: 16px; padding: 2rem; text-align: center;"><h3 style="color: #1a1a2e; margin-bottom: 1rem;">Latest Blog Posts</h3><div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 1.5rem; margin-top: 1.5rem;"><article style="background: white; padding: 1.5rem; border-radius: 12px; text-align: left;"><h4 style="color: #1a1a2e; margin-bottom: 0.5rem;">The Future of Serverless Architecture</h4><p style="color: #666; font-size: 0.9rem;">Exploring how serverless computing is reshaping modern application development and reducing operational overhead.</p><span style="color: #6c63ff; font-size: 0.85rem; margin-top: 0.5rem; display: block;">June 15, 2024 - 8 min read</span></article><article style="background: white; padding: 1.5rem; border-radius: 12px; text-align: left;"><h4 style="color: #1a1a2e; margin-bottom: 0.5rem;">Design Systems at Scale</h4><p style="color: #666; font-size: 0.9rem;">How we built a component library that serves 12 products and 50+ developers across our organization.</p><span style="color: #6c63ff; font-size: 0.85rem; margin-top: 0.5rem; display: block;">June 8, 2024 - 12 min read</span></article><article style="background: white; padding: 1.5rem; border-radius: 12px; text-align: left;"><h4 style="color: #1a1a2e; margin-bottom: 0.5rem;">Optimizing React Performance</h4><p style="color: #666; font-size: 0.9rem;">Practical strategies for reducing bundle size, improving rendering speed, and delivering better user experiences.</p><span style="color: #6c63ff; font-size: 0.85rem; margin-top: 0.5rem; display: block;">May 29, 2024 - 10 min read</span></article></div></div>';
            var ctaSection = document.getElementById('contact');
            if (ctaSection) {
                ctaSection.parentElement.insertBefore(lazySection, ctaSection);
            }
        }, 1500);
    }

    // Boot the application
    document.addEventListener('DOMContentLoaded', initApp);
    </script>
