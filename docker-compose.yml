x-ai-environment: &ai-environment
  CELERY_TASK_ALWAYS_EAGER: "false"
  GENERATION_MAX_CONCURRENT: "6"
  BEDROCK_MAX_CONCURRENT: "6"
  BEDROCK_REQUESTS_PER_MINUTE: "8"
  BEDROCK_TOKENS_PER_MINUTE: "500000"
  BEDROCK_MODEL_LIMITS: '{"anthropic.claude-sonnet-4-6":{"rpm":8,"tpm":4800000},"moonshotai.kimi-k3":{"rpm":120,"tpm":8000000},"anthropic.claude-sonnet-4-5-20250929-v1:0":{"rpm":8,"tpm":4000000},"anthropic.claude-opus-4-6-v1":{"rpm":4,"tpm":2400000}}'
  BEDROCK_FALLBACK_MODELS: "global.moonshotai.kimi-k3,us.anthropic.claude-haiku-4-5-20251001-v1:0,us.anthropic.claude-sonnet-4-5-20250929-v1:0,us.anthropic.claude-opus-4-6-v1,amazon.nova-pro-v1:0,us.meta.llama4-scout-17b-instruct-v1:0,mistral.mistral-large-2402-v1:0"

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  backend:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - .env.production
    environment: *ai-environment
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - backend_tmp:/app/tmp
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  celery-worker:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    restart: unless-stopped
    command: celery -A app.core.celery_app worker --loglevel=info --pool=solo --concurrency=1
    deploy:
      replicas: 2
    env_file:
      - .env.production
    environment: *ai-environment
    depends_on:
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    volumes:
      - backend_tmp:/app/tmp

  celery-beat:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    restart: unless-stopped
    command: celery -A app.core.celery_app beat --loglevel=info
    env_file:
      - .env.production
    environment: *ai-environment
    depends_on:
      redis:
        condition: service_healthy

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: https://sites-api.lenquant.com
        NEXT_PUBLIC_APP_URL: https://sites.lenquant.com
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    env_file:
      - .env.production
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3

  compiler:
    build:
      context: ./apps/compiler
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - HOST=0.0.0.0
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  redis_data:
  backend_tmp:
